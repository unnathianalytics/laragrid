name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repository's own composer.json lists a GitHub VCS repository; authenticate Composer's
# GitHub API calls with the job token so the matrix never hits the anonymous rate limit.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  dist:
    name: dist in sync + JS runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The line the maintainers build with. No npm cache: package-lock.json is not committed.
          node-version: '26'
      - run: npm install --no-audit --no-fund
      # The committed .br/.gz siblings must decode to the committed bundle. They are checked
      # by content, not by bytes: gzip output differs between zlib builds (Linux and Windows
      # Node disagree) and brotli may too, so a byte diff would fail a correct commit.
      - run: node build/check-compressed.mjs
      - run: npm run build
      # The committed bundle, stylesheet, map and version stamp must be exactly what the
      # source builds (the service provider serves them; consumers never run the build).
      - run: git diff --exit-code -- dist/ ':!dist/*.br' ':!dist/*.gz'
      - run: npm test

  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 is end of life, so Composer's security-advisory block refuses every
          # release of it. The row turns the block off: it exists to prove the oldest line
          # the package declares still passes, not to audit it.
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            lint: false
            eol: true
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            lint: false
          # Pint's current release needs PHP 8.3+ and older PHP resolves older tool versions,
          # so style and static analysis run once, on the newest line.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            lint: true
    steps:
      - uses: actions/checkout@v5
      # Some Pest tests run the Node vector runners (they import resources/js directly).
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_sqlite
          coverage: none
      - if: matrix.eol
        run: composer config --no-interaction policy.advisories.block false
      - name: Pin the Laravel line
        run: |
          composer require --no-update --no-interaction "illuminate/contracts:${{ matrix.laravel }}"
          composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
      - if: matrix.lint
        run: composer types
      - if: matrix.lint
        run: vendor/bin/pint --test
